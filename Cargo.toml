[workspace]
members = [
    "av_cli",
    "av_core",
    "av_engine",
    "av_managment_console",
    "av_tui", "spired",
]
resolver = "2"

[workspace.dependencies]
anyhow = "1.0.100"
chrono = "0.4.41"
env_logger = "0.11.8"
indicatif = "0.18.0"
log = "0.4.27"

[workspace.dependencies.clap]
version = "4.5.48"
features = ["derive"]

[workspace.dependencies.reqwest]
version = "0.12.22"
features = ["blocking"]

[workspace.dependencies.rusqlite]
version = "0.37.0"
features = ["bundled"]
